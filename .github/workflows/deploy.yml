name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/browser-coder

            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Force the working tree to exactly match origin/main. A plain
            # `git pull` fails on any local change or divergence, and because
            # this script previously had no `set -e` it continued anyway and
            # deployed a STALE docker-compose.prod.yml / nginx.conf - so config
            # changes (env vars, client_max_body_size) silently never applied.
            # `reset --hard` guarantees compose + nginx config are current.
            git fetch origin main
            git reset --hard origin/main

            # Pull new images using production compose file (pre-built GHCR image)
            docker compose -f docker-compose.prod.yml pull

            # Recreate the project's networks when their definition has changed.
            #
            # This step exists because the deploy that added `internal: true` to the
            # `internal` network (V-07 - no NAT egress from the sandbox) died here.
            # A network's attributes are fixed at creation, so compose had to delete
            # and recreate it, and the profile-gated autoscaler was still attached:
            #
            #   Error response from daemon: error while removing network:
            #   network browser-coder_internal has active endpoints
            #   (name:"browser-coder-autoscaler-1")
            #
            # It failed AFTER stopping nginx and api, so the site was down and a
            # plain re-run failed identically. See the script for why it refuses to
            # continue rather than deploying against a stale network.
            bash scripts/deploy-reset-networks.sh docker-compose.prod.yml

            # --force-recreate ensures containers restart with the updated
            # compose env + freshly pulled image, not a cached container.
            docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans

            # A deploy that leaves the API unhealthy is a failed deploy, not a
            # successful one with a broken site - and this script previously
            # reported success the moment `up` returned, which is before the
            # container has started, let alone passed a health check.
            # Read the state with `docker inspect` rather than `compose ps --format
            # json`: the compose JSON shape has changed between versions, and a health
            # gate that silently never matches would fail every deploy of a working
            # site - which is worse than no gate, because a red deploy nobody believes
            # is a red deploy nobody reads.
            echo "⏳ Waiting for the API to become healthy"
            healthy=""
            for attempt in $(seq 1 60); do
              for cid in $(docker compose -f docker-compose.prod.yml ps -q api); do
                state="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid" 2>/dev/null || echo unknown)"
                if [ "$state" = "healthy" ]; then healthy="yes"; break; fi
              done
              [ -n "$healthy" ] && break

              if [ "$attempt" -eq 60 ]; then
                echo "✗ No API replica became healthy within 120s" >&2
                docker compose -f docker-compose.prod.yml ps >&2
                docker compose -f docker-compose.prod.yml logs --tail=100 api nginx >&2
                exit 1
              fi
              sleep 2
            done
            echo "✓ API is healthy"

            # And that the site actually answers through nginx, which is the thing a
            # student loads. A healthy api behind a broken proxy is still an outage.
            if ! curl -fsS -o /dev/null --max-time 10 http://127.0.0.1/health; then
              echo "✗ nginx is not serving /health" >&2
              docker compose -f docker-compose.prod.yml logs --tail=100 nginx >&2
              exit 1
            fi
            echo "✓ nginx is serving"

            # Cleanup old images
            docker image prune -f

            echo "✅ Deployment complete!"
