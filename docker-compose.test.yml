# Docker Compose for Running Test Suite
# 
# Usage:
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit
#
# This will:
#   1. Start the API service
#   2. Run all tests against it
#   3. Generate reports in ./security/reports/
#   4. Exit with test result code

services:
  # ============================================
  # API Service (System Under Test)
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3001"
    environment:
      - NODE_ENV=test
      - PORT=3001
      - RATE_LIMIT_MAX=1000  # Higher limit for testing
      - RUN_TIMEOUT_MS=10000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - test-network

  # ============================================
  # Security Tests
  # ============================================
  test-security:
    build:
      context: .
      dockerfile: tests/Dockerfile.tests
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_URL=http://api:3001
      - TEST_SUITE=security
    volumes:
      - ./security/reports:/app/security/reports
    command: ["node", "security/run.mjs", "--server=http://api:3001"]
    networks:
      - test-network

  # ============================================
  # Language Compiler Tests
  # ============================================
networks:
  test-network:
    driver: bridge
