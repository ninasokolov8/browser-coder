# Docker Compose for running the security corpus against the production image.
#
# Usage:
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit
#
# This will:
#   1. Build and start the production API image with production-style isolation
#   2. Run the canonical security corpus against it
#   3. Generate reports in ./security/reports/
#   4. Exit with test result code

services:
  # ============================================
  # API Service (System Under Test)
  # ============================================
  api:
    init: true
    build:
      context: .
      dockerfile: Dockerfile.production
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - RATE_LIMIT_MAX=1000  # Higher limit for testing
      - RUN_TIMEOUT_MS=10000
      - PREVIEW_STORAGE_DIR=/preview-data
      - BLOB_CACHE_DIR=/blob-cache
      - SHARE_STORAGE_DIR=/share-data
    read_only: true
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - KILL
    tmpfs:
      - /tmp:noexec,nosuid,size=100M
      - /app/sandbox:noexec,nosuid,size=512M,uid=1001,gid=1001
      - /preview-data:noexec,nosuid,size=64M,uid=1001,gid=1001
      - /blob-cache:noexec,nosuid,size=64M,uid=1001,gid=1001
      - /share-data:noexec,nosuid,size=64M,uid=1001,gid=1001
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  # ============================================
  # Security Tests
  # ============================================
  test-security:
    build:
      context: .
      dockerfile: tests/Dockerfile.tests
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_URL=http://api:3001
      - TEST_SUITE=security
    volumes:
      - ./security/reports:/app/security/reports
    command: ["node", "security/run.mjs", "--server=http://api:3001"]
    networks:
      - internal

networks:
  internal:
    driver: bridge
    internal: true
