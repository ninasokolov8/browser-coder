# Browser Coder - production nginx.
#
# Four things in here are load-bearing and easy to break by tidying:
#
#   1. /api/run/interactive MUST NOT be buffered. It is a long-lived streaming
#      NDJSON response, and buffering it means the student sees nothing until the
#      program exits - which for a program waiting on input is forever.
#   2. `add_header` does NOT accumulate across levels. A location that declares any
#      add_header inherits NONE from the server block. Every location therefore
#      states its own headers in full.
#   3. The connection limit is per client ADDRESS, and a whole classroom shares one
#      NAT address.
#   4. `proxy_set_header Connection ""` enables upstream keepalive but also breaks
#      protocol upgrades, so the upgrade-capable locations use the $connection_upgrade
#      map instead.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr [$time_local] "$request" $status '
                    '$body_bytes_sent rt=$request_time upstream=$upstream_addr';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml font/woff font/woff2;

    # ── V-39: protocol upgrade ──────────────────────────────────────────────────
    # Every location previously sent `Connection ""`, which is correct for upstream
    # keepalive and fatal for an upgrade. This map passes the upgrade through when a
    # client asks for one and keeps the connection pooled otherwise, so the same
    # config serves both. The interactive protocol is NDJSON over plain HTTP today;
    # this exists so moving it to a WebSocket is a server change, not a redeploy of
    # the proxy.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=preview_publish_limit:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=preview_read_limit:10m rate=20r/s;
    # Interactive sessions are long-lived, so they are rate-limited on how often a
    # client may START one rather than on request volume.
    limit_req_zone $binary_remote_addr zone=interactive_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api_servers {
        least_conn;
        server api:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m
                     max_size=100m inactive=10m use_temp_path=off;

    # Shared proxy headers. An include rather than a copy in eleven places, because
    # the copies had already drifted.
    # (Kept inline below rather than as a separate file so the deployment stays a
    # single mounted config.)

    server {
        listen 80;
        server_name _;

        # ── V-41: the per-IP connection limit ───────────────────────────────────
        #
        # Was 20. A school sits behind ONE NAT address, and the IDE holds several
        # connections per user - the document, assets, and now a long-lived
        # interactive session per run. A class of 30 exhausted 20 before anyone had
        # run anything, and the failure looked like the service being down.
        #
        # This is a crude backstop against a single host opening unbounded
        # connections, not a fairness mechanism; per-user fairness is the API's
        # rate limiter, which counts requests rather than sockets.
        limit_conn conn_limit 400;

        # ── V-43 ────────────────────────────────────────────────────────────────
        #
        # X-Frame-Options: SAMEORIGIN used to sit here at server level. It appeared
        # to be applied everywhere, but nginx does not accumulate add_header across
        # levels: any location declaring its own add_header inherited NONE of these.
        # So it reached the API and health responses and NOT the IDE document - which
        # is the only reason Step-Up embedding worked at all. Relying on that is a
        # trap: adding a header to `location /` for an unrelated reason would have
        # kept embedding working, and REMOVING one would silently have broken it.
        #
        # Nothing is declared at server level now. Every location states its headers
        # in full, so what a response carries is readable in one place.

        location = /health {
            proxy_pass http://api_servers/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            access_log off;
        }

        # A Vite asset must never fall back to index.html: a browser receiving
        # text/html for a .js request reports a MIME error that looks nothing like
        # the deployment problem it is.
        location ^~ /assets/ {
            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_intercept_errors off;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ── V-40: the interactive session ───────────────────────────────────────
        #
        # There was no location for this route, so it fell through to `location /api/`
        # and inherited two settings that break it:
        #
        #   proxy_buffering on (the default) - nginx accumulates the response and
        #     forwards it in chunks. The interactive protocol is a live NDJSON stream
        #     whose whole purpose is to deliver a "waiting" event WHILE the program is
        #     blocked on input. Buffered, the student sees nothing until the program
        #     exits, and a program waiting for input never exits. The feature is
        #     simply non-functional behind this proxy.
        #
        #   proxy_read_timeout 30s - a student thinking about what to type for 31
        #     seconds had the session cut.
        #
        # The body limit also matched nginx's 1 MiB default rather than the 3m that
        # /api/run gets, so a large project failed only on the interactive path.
        location ^~ /api/run/interactive {
            limit_req zone=interactive_limit burst=20 nodelay;
            client_max_body_size 3m;

            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # The three that make streaming work.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            # Belt and braces: honoured by nginx itself and by any CDN in front.
            add_header X-Accel-Buffering "no" always;
            add_header X-Content-Type-Options "nosniff" always;

            proxy_connect_timeout 5s;
            proxy_send_timeout 1h;
            # Must exceed the server's own interactive lifetime cap
            # (INTERACTIVE_MAX_MS, 15 minutes) so the SERVER ends the session with a
            # real terminal event rather than the proxy severing it mid-stream.
            proxy_read_timeout 1h;
        }

        location = /api/previews {
            limit_req zone=preview_publish_limit burst=5 nodelay;
            # Publishes the complete IDE workspace as JSON. 12 MB covers the
            # configured 5 MB project limit plus JSON escaping and metadata.
            client_max_body_size 12m;

            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            add_header X-Content-Type-Options "nosniff" always;

            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        # Published previews are DESIGNED to be framed, and the application sets
        # their CSP - including the sandbox directive that contains student code
        # (V-03). nginx must add no framing header here, or it would fight the
        # policy the application computed per file type.
        location ^~ /preview/ {
            limit_req zone=preview_read_limit burst=40 nodelay;

            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        location = /api/run {
            limit_req zone=api_limit burst=50 nodelay;
            # The server derives its own /api/run body limit from the size policy in
            # server/config.mjs (MAX_CODE_CHARS et al) - about 2.26 MB for a 750 KB
            # project once JSON escaping and per-file metadata are counted. 3m gives
            # that headroom; raise it if the size policy grows.
            client_max_body_size 3m;

            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            add_header X-Content-Type-Options "nosniff" always;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            # Java pays javac on every run and C# pays a first build, and the server's
            # own caps are 30s and 45s. A 30s proxy timeout cut the request before the
            # server could answer, turning a slow compile into a 504.
            proxy_read_timeout 90s;
        }

        location ~ ^/api/(languages|starter) {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_cache api_cache;
            proxy_cache_valid 200 5m;
            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # The IDE document.
        #
        # Deliberately carries NO X-Frame-Options: Step-Up embeds this page in an
        # iframe, and denying framing here breaks every embedded lesson. Restricting
        # WHICH origins may embed it belongs in a CSP frame-ancestors directive with
        # the real host list - see the note in nginx/README.md - and must be
        # introduced together with that list rather than guessed at here.
        #
        # HTML is always revalidated, so a deploy cannot leave a user holding an old
        # document that references assets the new image removed.
        location / {
            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        error_page 429 = @rate_limit;
        error_page 502 503 504 = @api_error;

        location @rate_limit {
            default_type application/json;
            return 429 '{"error":"Too many requests","retryAfter":60}';
        }

        location @api_error {
            default_type application/json;
            return 503 '{"error":"Service temporarily unavailable","retryAfter":5}';
        }
    }

    # ── V-42: TLS ───────────────────────────────────────────────────────────────
    #
    # docker-compose.prod.yml publishes 443 and nginx listened on 80 only, so the
    # mapped port answered nothing.
    #
    # A `listen 443 ssl` block cannot be added unconditionally: nginx refuses to
    # start when the certificate files are absent, which would turn a missing cert
    # into a total outage rather than a missing feature. So the block lives in an
    # optional include. Drop a file in nginx/tls/ (see nginx/tls/README.md for a
    # ready-to-use template) and it is served; leave the directory empty and the
    # deployment keeps working on port 80 exactly as before.
    include /etc/nginx/tls/*.conf;
}
